name: plantao
description: "Plantão Operacional PRO - Agenda inteligente para equipes e plantões."
publish_to: 'none'

version: 2.3.0+23

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- UI e Core ---
  table_calendar: ^3.0.9
  flutter_colorpicker: ^1.0.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

  # Banco de Dados Local (cache offline)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilitários
  uuid: ^4.3.3
  collection: ^1.18.0
  path_provider: ^2.1.3
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Funcionalidades (Backup, Atualização, etc)
  file_picker: ^8.0.0+1
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  http: ^1.2.1
  open_filex: ^4.4.0
  url_launcher: ^6.3.0
  sqflite: ^2.3.3

  # --- Auth & Google APIs ---
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12

  # --- Firebase ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # --- State Management ---
  provider: ^6.1.2

  # --- Home Screen Widget ---
  home_widget: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/